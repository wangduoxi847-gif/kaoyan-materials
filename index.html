<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#222;font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;background:#fff;min-height:100vh}
@media (min-width:900px){.wrap{max-width:none}}
header{position:sticky;top:0;background:#3d5a99;color:#fff;padding:14px 16px;z-index:10}
header h1{font-size:18px;letter-spacing:2px}
header p{font-size:12px;opacity:.85;margin-top:2px}
.search{position:sticky;top:0;background:#fff;padding:10px 16px;border-bottom:1px solid #eee;z-index:9}
.search input{width:100%;padding:9px 14px;border:1px solid #dfe3ec;border-radius:20px;font-size:14px;outline:none;background:#f5f6f8}
.search input:focus{border-color:#3d5a99;background:#fff}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:10px 16px;font-size:14px;color:#666;border-bottom:1px solid #f0f0f0}
.crumb a{color:#3d5a99;text-decoration:none;cursor:pointer}
.crumb .sep{color:#bbb}
.sec-t{padding:12px 16px 4px;font-size:13px;color:#999}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f2f2f2;cursor:pointer;text-decoration:none;color:inherit}
.row:active{background:#f5f6f8}
.ic{font-size:22px;flex:none;width:30px;text-align:center}
.row .tt{flex:1;min-width:0}
.row .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:12.5px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .m{font-size:12px;color:#aaa;margin-top:1px}
.row .cnt{font-size:12px;color:#aaa;flex:none}
.star{flex:none;font-size:18px;color:#ccc;padding:4px;cursor:pointer}
.star.on{color:#f5a623}
.empty{padding:40px 16px;text-align:center;color:#aaa;font-size:14px}
</style>
</head>

let cur = [];
const $ = id => document.getElementById(id);
const get = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : d; } catch(e){ return d; } };
const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const byHref = h => FILES.find(f => f.h === h);
function foldersAt(prefix){
  const s = new Set();
  for (const f of FILES){
    if (prefix){
      if (f.p !== prefix && !f.p.startsWith(prefix + '/')) continue;
      if (f.p === prefix) continue;
      s.add(f.p.slice(prefix.length + 1).split('/')[0]);
    } else { s.add(f.p.split('/')[0]); }
  }
  if (!prefix){
    const order = ['数学','英语','408'];
    return order.filter(x => s.has(x)).concat([...s].filter(x => !order.includes(x)).sort());
  }
  return [...s].sort();
}
function filesAt(prefix){ return FILES.filter(f => f.p === prefix); }
function countFiles(folderPath){
  const pre = folderPath + '/';
  return FILES.filter(f => f.p === folderPath || f.p.startsWith(pre)).length;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function rowFolder(name, full){
  const n = countFiles(full);
  return '<div class="row" data-f="' + esc(full) + '"><div class="ic">📁</div><div class="tt"><div class="t">' + esc(name) + '</div></div><div class="cnt">' + n + ' 项</div><div class="cnt">›</div></div>';
}
function rowFile(f){
  const starred = get('kym_star', []).includes(f.h) ? ' on' : '';
  const isPdf = /\.pdf$/i.test(f.h);
  const href = isPdf ? './viewer.html?file=' + encodeURIComponent(f.h.replace(/^\.\//, '')) + '&title=' + encodeURIComponent(f.t) : f.h;
  return '<a class="row" data-h="' + esc(f.h) + '" href="' + esc(href) + '"><div class="ic">📄</div><div class="tt"><div class="t">' + esc(f.t) + '</div><div class="d">' + esc(f.d) + '</div><div class="m">' + esc(f.m) + '</div></div><div class="star' + starred + '" data-s="' + esc(f.h) + '">★</div></a>';
}
function render(){
  const q = $('q').value.trim();
  const list = $('list'), crumb = $('crumb');
  if (q){
    crumb.innerHTML = '<a data-c="">全部文件</a><span class="sep">/</span><span>搜索“' + esc(q) + '”</span>';
    const hits = FILES.filter(f => (f.t + f.d).includes(q));
    list.innerHTML = hits.length ? hits.map(rowFile).join('') : '<div class="empty">没找到“' + esc(q) + '”</div>';
    bind(); return;
  }
  const prefix = cur.join('/');
  let ch = '<a data-c="">全部文件</a>';
  cur.forEach((seg, i) => { ch += '<span class="sep">/</span><a data-c="' + i + '">' + esc(seg) + '</a>'; });
  crumb.innerHTML = ch;
  let html = '';
  if (!cur.length){
    const stars = get('kym_star', []).map(byHref).filter(Boolean);
    if (stars.length) html += '<div class="sec-t">⭐ 星标文件</div>' + stars.map(rowFile).join('');
    const rec = get('kym_recent', []).map(byHref).filter(Boolean);
    if (rec.length) html += '<div class="sec-t">🕘 最近打开</div>' + rec.map(rowFile).join('');
  }
  const folders = foldersAt(prefix);
  const files = filesAt(prefix);
  if (!folders.length && !files.length && cur.length) html += '<div class="empty">空文件夹</div>';
  html += folders.map(nm => rowFolder(nm, prefix ? prefix + '/' + nm : nm)).join('');
  html += files.map(rowFile).join('');
  list.innerHTML = html;
  bind();
}
function bind(){
  document.querySelectorAll('#list .row[data-f]').forEach(el => {
    el.onclick = () => { cur = el.dataset.f.split('/'); $('q').value=''; render(); window.scrollTo(0,0); };
  });
  document.querySelectorAll('#list .row[data-h]').forEach(el => {
    el.addEventListener('click', () => {
      const h = el.dataset.h;
      set('kym_recent', [h, ...get('kym_recent', []).filter(x => x !== h)].slice(0, 2));
    });
  });
  document.querySelectorAll('#list .star').forEach(el => {
    el.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      const h = el.dataset.s;
      let s = get('kym_star', []);
      s = s.includes(h) ? s.filter(x => x !== h) : [...s, h];
      set('kym_star', s); render();
    };
  });
  document.querySelectorAll('#crumb a').forEach(a => {
    a.onclick = () => { const i = a.dataset.c; cur = i === '' ? [] : cur.slice(0, +i + 1); $('q').value=''; render(); };
  });
}
$('q').addEventListener('input', render);
render();
</script>
